name: 中文界面测试

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.14']
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 语法检查
        run: |
          python -m py_compile datameter.py preview.py traffic_history.py history_view.py terminal_charts.py
          bash -n datameter contrib/install-polkit-rule.sh
      - name: 单元测试与真实终端交互
        run: python -m unittest discover -s tests -v
